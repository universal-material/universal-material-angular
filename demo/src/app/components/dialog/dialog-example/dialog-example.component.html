<u-button type="button" variant="text" (click)="show = true">Show</u-button>
<u-legacy-dialog [(show)]="show">
  <div class="u-dialog-content">
    <div class="u-dialog-header">
      <div class="u-dialog-title">Dialog title</div>
    </div>
    <div class="u-dialog-body" uDialogBody>

    </div>
    <div class="u-dialog-actions" uDialogBody>
      <u-button variant="text" class="u-dialog-action" (click)="show = false">Ok</u-button>
    </div>
  </div>
</u-legacy-dialog>
